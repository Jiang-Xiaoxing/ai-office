<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>暖灯小阁 · 阁楼工作室</title>
<meta name="theme-color" content="#493b37">
<link rel="icon" type="image/png" sizes="16x16" href="static/assets/attic-icon-16.png">
<link rel="icon" type="image/png" sizes="32x32" href="static/assets/attic-icon-32.png">
<link rel="shortcut icon" href="static/assets/favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="static/assets/attic-icon-180.png">
<link rel="stylesheet" href="static/office.css">
</head>
<body>
<header id="bar">
  <div class="identity"><img class="office-icon" src="static/assets/attic-icon-48.png" alt="" width="40" height="40"><h1>暖灯小阁</h1><span class="owner">阁楼工作室</span></div>
  <p class="interaction-hint" aria-label="阁楼互动提示"><span><img src="static/assets/ui-water.svg" alt="" width="24" height="24">点花盆浇水</span><span><img src="static/assets/ui-tea.svg" alt="" width="24" height="24">点茶桌泡茶</span></p>
  <div class="connection"><span id="weather" title="按北京时间自动变化的场景天气"></span><span id="signal" class="signal"></span><span id="connection">正在连接</span><time id="ts">--:--:--</time></div>
</header>
<main id="wrap" aria-label="温馨阁楼工作室，伙伴们干活时回工位，空闲时看书、喝茶或打盹">
  <canvas id="game" role="img" aria-label="正在布置暖灯小阁"></canvas>
  <div id="labels" aria-hidden="true"></div>
  <div id="interaction-targets" aria-label="点击伙伴打招呼，点击盆栽浇水，点击茶桌泡茶"></div>
  <div id="interaction-note" role="status" aria-live="polite" aria-atomic="true" hidden><div><strong></strong><span></span></div><button type="button" aria-label="收起互动消息" title="收起（Escape）">×</button></div>
  <div id="loading" role="status">正在点亮小阁…</div>
  <div id="notice" role="status" hidden></div>
</main>
<footer id="footer">
  <div id="roster" aria-label="工具状态"></div>
</footer>
<script src="static/weather.js"></script>
<script src="static/interaction.js"></script>
<script src="static/office.js"></script>
</body>
</html>
