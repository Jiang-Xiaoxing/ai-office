<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 办公室 · 姜小星</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: #1a1a2e; }
  body {
    font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
    display: flex; flex-direction: column; align-items: center;
    color: #e0e0e0;
  }
  #bar {
    width: 100%; height: 48px; background: #16213e;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 20px; box-shadow: 0 2px 8px rgba(0,0,0,.4);
    z-index: 10; flex-shrink: 0;
  }
  #bar .title { font-size: 18px; font-weight: bold; color: #e94560; letter-spacing: 2px; }
  #bar .ts { font-size: 12px; color: #888; font-family: monospace; }
  #wrap {
    flex: 1; display: flex; justify-content: center; align-items: center;
    width: 100%; position: relative; overflow: hidden;
  }
  #game {
    image-rendering: pixelated; image-rendering: crisp-edges;
    border-radius: 8px; box-shadow: 0 0 24px rgba(0,0,0,.6);
    max-width: 100vw; max-height: calc(100vh - 48px);
  }
  #legend {
    position: absolute; bottom: 12px; right: 12px;
    background: rgba(22,33,62,.85); border-radius: 6px; padding: 8px 12px;
    font-size: 12px; display: flex; gap: 16px; z-index: 5;
  }
  #legend .item { display: flex; align-items: center; gap: 6px; }
  #legend .dot { width: 10px; height: 10px; border-radius: 50%; }
  .dot.working { background: #4ecca3; box-shadow: 0 0 6px #4ecca3; }
  .dot.idle { background: #f0a500; box-shadow: 0 0 6px #f0a500; }
</style>
</head>
<body>
<div id="bar">
  <span class="title">★ AI 办公室</span>
  <span class="ts" id="ts">--:--:--</span>
</div>
<div id="wrap">
  <canvas id="game"></canvas>
  <div id="legend">
    <div class="item"><span class="dot working"></span>干活中</div>
    <div class="item"><span class="dot idle"></span>摸鱼中</div>
  </div>
</div>
<script src="static/office.js"></script>
</body>
</html>
